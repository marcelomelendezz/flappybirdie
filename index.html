<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOMOS · Flappy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;}
#app{position:relative;width:100%;height:100%;overflow:hidden;cursor:pointer;}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
#score-wrap{
  position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none;
}
#score{
  font-family:'Arial Black',sans-serif;font-size:clamp(36px,10vw,58px);
  color:#fff;font-weight:900;
  text-shadow:0 4px 0 rgba(0,0,0,0.35),0 0 20px rgba(255,255,255,0.3);
  letter-spacing:2px;
}
#best{
  font-family:'Arial Black',sans-serif;font-size:clamp(12px,3vw,16px);
  color:rgba(255,255,255,0.6);font-weight:700;letter-spacing:1px;margin-top:2px;
}
/* Screens */
#screen{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;pointer-events:none;
}
.sc-card{
  background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);
  border-radius:18px;padding:22px 32px;text-align:center;
  border:2px solid rgba(255,255,255,0.15);min-width:220px;
  pointer-events:none;
}
.sc-title{font-family:'Arial Black',sans-serif;font-size:clamp(22px,6vw,36px);
  color:#fff;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.4);letter-spacing:2px;}
.sc-sub{font-family:Arial,sans-serif;font-size:clamp(11px,3vw,15px);
  color:rgba(255,255,255,.7);margin-top:6px;line-height:1.5;}
.sc-score{font-family:'Arial Black',sans-serif;font-size:clamp(28px,8vw,48px);
  color:#ffd700;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.4);}
.sc-best{font-size:clamp(12px,3vw,16px);color:rgba(255,200,50,.8);margin-top:4px;}
.medal{font-size:clamp(36px,10vw,58px);margin-bottom:4px;}
.tap-hint{
  font-family:'Arial Black',sans-serif;font-size:clamp(13px,3.5vw,18px);
  color:#fff;font-weight:700;letter-spacing:1px;
  animation:blink 1s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.4);
  pointer-events:none;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="score-wrap">
    <div id="score"></div>
    <div id="best"></div>
  </div>
  <div id="screen"></div>
</div>

<script>
// ══════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════
let AC=null;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,dur,type='sine',vol=0.15,freqEnd=null){
  try{
    const a=getAC(),o=a.createOscillator(),g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type=type; o.frequency.value=freq;
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,a.currentTime+dur);
    const t=a.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function sfxFlap(){tone(380,0.07,'square',0.14); tone(520,0.06,'square',0.1,0.04);}
function sfxScore(){tone(988,0.06,'sine',0.18); tone(1319,0.1,'sine',0.15,0.06);}
function sfxHit(){
  tone(150,0.15,'sawtooth',0.2,80);
  tone(100,0.2,'square',0.15,60);
}
function sfxDie(){
  [440,370,294,220].forEach((f,i)=>tone(f,0.09,'square',0.14,i*0.07));
}

// ══════════════════════════════════════════
// CANVAS
// ══════════════════════════════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const app=document.getElementById('app');
let W=0,H=0;
function resize(){
  W=canvas.width=app.clientWidth;
  H=canvas.height=app.clientHeight;
}
window.addEventListener('resize',()=>{resize();buildBg();});
resize();

// ══════════════════════════════════════════
// CONSTANTS  (all relative to H/W)
// ══════════════════════════════════════════
const PIPE_W   = ()=>W*0.13;
const PIPE_GAP = ()=>H*0.26;
const PIPE_SPEED = ()=>W*0.003;
const PIPE_INTERVAL = ()=>W*0.58;
const GROUND_H = ()=>H*0.13;
const BIRD_X   = ()=>W*0.22;
const BIRD_R   = ()=>Math.min(W,H)*0.038;
const GRAVITY  = ()=>H*0.0014;
const JUMP_V   = ()=>-H*0.022;
const MAX_FALL = ()=>H*0.016;
const MAX_RISE = ()=>H*0.028;

// ══════════════════════════════════════════
// BACKGROUND LAYERS (parallax)
// ══════════════════════════════════════════
let bgLayers=[];

function buildBg(){
  bgLayers=[];
  // Stars/dots layer (far)
  const stars=[];
  for(let i=0;i<60;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.75,r:Math.random()*2.5+0.5,a:0.3+Math.random()*0.5});
  bgLayers.push({type:'stars',items:stars,speed:0.1});
  // City silhouette (mid)
  const buildings=[];
  for(let x=0;x<W+60;x+=22+Math.random()*18){
    buildings.push({x,w:22+Math.random()*18,h:H*(0.08+Math.random()*0.2)});
  }
  bgLayers.push({type:'buildings',items:buildings,speed:0.4,x:0});
  // Hills (near)
  const hills=[];
  for(let x=-50;x<W+50;x+=60+Math.random()*40){
    hills.push({x,r:50+Math.random()*40});
  }
  bgLayers.push({type:'hills',items:hills,speed:0.7,x:0});
}

function scrollBg(dx){
  bgLayers.forEach(layer=>{
    if(layer.type==='stars'){
      layer.items.forEach(s=>{ s.x-=dx*layer.speed; if(s.x<-5) s.x=W+5; });
    } else {
      layer.x-=dx*layer.speed;
    }
  });
}

// ══════════════════════════════════════════
// GAME STATE
// ══════════════════════════════════════════
let state='menu'; // menu | playing | dead | gameover
let score=0, best=parseInt(localStorage.getItem('flappy_best')||'0');
let animT=0, lastT=0;

// Bird
const bird={
  x:0,y:0,vy:0,
  angle:0,targetAngle:0,
  alive:true,
  hitTimer:0,
  trail:[],
  wingPhase:0,
};

// Pipes
let pipes=[];
let pipeTimer=0;

// Particles
let particles=[];

// Ground scroll
let groundX=0;

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function initBird(){
  bird.x=BIRD_X();
  bird.y=H*0.45;
  bird.vy=0;
  bird.angle=0;
  bird.trail=[];
  bird.wingPhase=0;
  bird.alive=true;
  bird.hitTimer=0;
}

function startGame(){
  score=0;
  pipes=[];
  pipeTimer=0;
  particles=[];
  groundX=0;
  initBird();
  state='playing';
  updateScoreUI();
  setScreen(null);
}

function resetToMenu(){
  initBird();
  pipes=[];
  particles=[];
  groundX=0;
  state='menu';
  updateScoreUI();
  showMenu();
}

// ══════════════════════════════════════════
// FLAP
// ══════════════════════════════════════════
function flap(){
  if(state==='gameover'||state==='menu'){ startGame(); return; }
  if(state==='dead'){
    // Skip death animation, go straight to gameover then restart
    state='gameover';
    startGame();
    return;
  }
  if(state==='playing'&&bird.alive){
    bird.vy=JUMP_V();
    sfxFlap();
    // Wing burst particles
    for(let i=0;i<5;i++){
      const a=Math.PI+Math.random()*0.8-0.4;
      particles.push({
        x:bird.x,y:bird.y+BIRD_R()*0.5,
        vx:Math.cos(a)*2,vy:Math.sin(a)*2-1,
        life:18,ml:18,r:3+Math.random()*2,
        color:`hsla(${40+Math.random()*30},90%,70%,1)`,
      });
    }
  }
}

// ══════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════
function update(dt){
  animT+=dt;
  const speed=PIPE_SPEED();

  if(state==='playing'){
    // ── Bird physics ───────────────────────
    bird.vy=Math.max(Math.min(bird.vy+GRAVITY(),MAX_FALL()),-MAX_RISE());
    bird.y+=bird.vy;
    bird.wingPhase+=8*dt;

    // Trail
    bird.trail.push({x:bird.x,y:bird.y,a:0.35});
    if(bird.trail.length>8) bird.trail.shift();

    // Rotation: smoothly track velocity
    const targetAngle=Math.atan2(bird.vy,speed*40)*0.8;
    bird.angle+=(targetAngle-bird.angle)*0.18;
    bird.angle=Math.max(-0.55,Math.min(Math.PI*0.42,bird.angle));

    // ── Pipes ──────────────────────────────
    pipeTimer+=speed;
    if(pipeTimer>=PIPE_INTERVAL()){
      pipeTimer=0;
      const gapY=GROUND_H()+PIPE_GAP()*0.2+Math.random()*(H-GROUND_H()-PIPE_GAP()*1.4);
      pipes.push({x:W+PIPE_W(),gapY,scored:false});
    }
    pipes.forEach(p=>p.x-=speed);
    pipes=pipes.filter(p=>p.x>-PIPE_W()-20);

    // ── Scoring ────────────────────────────
    pipes.forEach(p=>{
      if(!p.scored&&p.x+PIPE_W()/2<bird.x){
        p.scored=true; score++;
        if(score>best){ best=score; localStorage.setItem('flappy_best',best); }
        sfxScore();
        updateScoreUI();
        // Score burst
        for(let i=0;i<10;i++){
          const a=Math.random()*Math.PI*2;
          particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,
            life:25,ml:25,r:4,color:`hsl(${50+i*15},100%,60%)`});
        }
      }
    });

    // ── Scroll BG & ground ─────────────────
    scrollBg(speed);
    groundX=(groundX-speed)%(W*0.1);

    // ── Collision ──────────────────────────
    if(bird.alive){
      const br=BIRD_R()*0.78; // slightly forgiving hitbox
      // Ground / ceiling
      if(bird.y+br>=H-GROUND_H()||bird.y-br<=0){ killBird(); return; }
      // Pipes
      pipes.forEach(p=>{
        const pw=PIPE_W(), gh=PIPE_GAP()/2;
        const inX=bird.x+br>p.x&&bird.x-br<p.x+pw;
        if(inX){
          if(bird.y-br<p.gapY-gh||bird.y+br>p.gapY+gh){ killBird(); return; }
        }
      });
    }

  } else if(state==='dead'){
    // Bird falls off screen
    bird.vy=Math.min(bird.vy+GRAVITY()*1.5,MAX_FALL()*1.5);
    bird.y+=bird.vy;
    bird.angle=Math.min(bird.angle+0.08,Math.PI*0.5);
    if(bird.y>H+50){
      state='gameover';
      showGameOver();
    }
  } else if(state==='menu'){
    // Bob bird in menu
    bird.y=H*0.42+Math.sin(animT*2.5)*H*0.025;
    bird.angle=Math.sin(animT*2.5)*0.15;
    bird.wingPhase+=6*dt;
    scrollBg(speed*0.5);
    groundX=(groundX-speed*0.5)%(W*0.1);
  }

  // ── Particles ────────────────────────────
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15;
    p.vx*=0.95; p.life--;
  });
  particles=particles.filter(p=>p.life>0);
}

function killBird(){
  if(!bird.alive) return;
  bird.alive=false;
  bird.vy=JUMP_V()*0.4;
  state='dead';
  sfxHit();
  setTimeout(sfxDie,150);
  // Big explosion
  for(let i=0;i<20;i++){
    const a=(i/20)*Math.PI*2;
    const sp=2+Math.random()*4;
    particles.push({x:bird.x,y:bird.y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
      life:40,ml:40,r:5+Math.random()*5,
      color:`hsl(${Math.random()*60},100%,60%)`});
  }
}

// ══════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════
function draw(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a1a3a');
  sky.addColorStop(0.5,'#1a3a6a');
  sky.addColorStop(1,'#2a5a2a');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  drawBgLayers();
  drawPipes();
  drawGround();
  drawBird();
  drawParticles();
}

function drawBgLayers(){
  bgLayers.forEach(layer=>{
    if(layer.type==='stars'){
      layer.items.forEach(s=>{
        ctx.fillStyle=`rgba(255,255,255,${s.a+Math.sin(animT+s.x)*0.1})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      });
    } else if(layer.type==='buildings'){
      const floorY=H-GROUND_H();
      layer.items.forEach(b=>{
        const bx=(b.x+layer.x)%W+( (b.x+layer.x)<0?W:0 );
        ctx.fillStyle='rgba(10,20,50,0.85)';
        ctx.fillRect(bx,floorY-b.h,b.w,b.h);
        // Windows
        ctx.fillStyle='rgba(255,220,80,0.35)';
        for(let wy=floorY-b.h+4;wy<floorY-6;wy+=9){
          for(let wx=bx+3;wx<bx+b.w-5;wx+=7){
            if(Math.random()>0.35) ctx.fillRect(wx,wy,4,5);
          }
        }
      });
    } else if(layer.type==='hills'){
      ctx.fillStyle='rgba(20,50,20,0.8)';
      layer.items.forEach(h=>{
        const hx=(h.x+layer.x)%(W+120)-(60);
        ctx.beginPath(); ctx.arc(hx,H-GROUND_H(),h.r,Math.PI,0); ctx.fill();
      });
    }
  });
}

function drawPipes(){
  const pw=PIPE_W(), gh=PIPE_GAP()/2;
  pipes.forEach(p=>{
    // Top pipe
    drawPipe(p.x, 0, pw, p.gapY-gh, 'top');
    // Bottom pipe
    drawPipe(p.x, p.gapY+gh, pw, H-GROUND_H()-(p.gapY+gh), 'bot');
  });
}

function drawPipe(x,y,w,h,type){
  if(h<=0) return;
  const capH=w*0.22, capW=w*1.12;
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#2a8a20');
  g.addColorStop(0.35,'#40cc30');
  g.addColorStop(0.65,'#30aa20');
  g.addColorStop(1,'#1a6010');
  ctx.fillStyle=g;
  if(type==='top'){
    ctx.fillRect(x,y,w,h-capH);
    // Cap
    const cg=ctx.createLinearGradient(x-capW*0.06,0,x+capW,0);
    cg.addColorStop(0,'#238818'); cg.addColorStop(0.3,'#3acc28'); cg.addColorStop(0.7,'#28aa18'); cg.addColorStop(1,'#156008');
    ctx.fillStyle=cg;
    ctx.fillRect(x-(capW-w)/2,y+h-capH,capW,capH);
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(x+w*0.12,y,w*0.2,h-capH);
    ctx.fillRect(x-(capW-w)/2+capW*0.1,y+h-capH,capW*0.18,capH);
  } else {
    ctx.fillRect(x,y+capH,w,h-capH);
    const cg=ctx.createLinearGradient(x-capW*0.06,0,x+capW,0);
    cg.addColorStop(0,'#238818'); cg.addColorStop(0.3,'#3acc28'); cg.addColorStop(0.7,'#28aa18'); cg.addColorStop(1,'#156008');
    ctx.fillStyle=cg;
    ctx.fillRect(x-(capW-w)/2,y,capW,capH);
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(x+w*0.12,y+capH,w*0.2,h-capH);
    ctx.fillRect(x-(capW-w)/2+capW*0.1,y,capW*0.18,capH);
  }
  // Edge shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.fillRect(x+w-w*0.12,y,w*0.12,h);
}

function drawGround(){
  const gh=GROUND_H();
  const gy=H-gh;
  // Ground base
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#c87820'); gg.addColorStop(0.15,'#a06018'); gg.addColorStop(1,'#6a3a08');
  ctx.fillStyle=gg; ctx.fillRect(0,gy,W,gh);
  // Grass strip
  const grassG=ctx.createLinearGradient(0,gy,0,gy+gh*0.18);
  grassG.addColorStop(0,'#50cc30'); grassG.addColorStop(1,'#30a018');
  ctx.fillStyle=grassG; ctx.fillRect(0,gy,W,gh*0.18);
  // Scrolling tiles
  const tileW=W*0.1;
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let x=groundX;x<W+tileW;x+=tileW){
    ctx.fillRect(x,gy,1.5,gh);
  }
  // Pebbles
  ctx.fillStyle='rgba(255,200,100,0.3)';
  for(let i=0;i<12;i++){
    const px=((i*137.5+groundX*2)%W);
    ctx.beginPath(); ctx.ellipse(px,gy+gh*0.5,4,2.5,0,0,Math.PI*2); ctx.fill();
  }
}

function drawBird(){
  const br=BIRD_R();

  // Trail
  bird.trail.forEach((t,i)=>{
    const a=(i/bird.trail.length)*0.22;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffd060';
    ctx.beginPath(); ctx.arc(t.x,t.y,br*(i/bird.trail.length)*0.7,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle);

  // Death flash
  if(bird.hitTimer>0){
    ctx.globalAlpha=0.5+Math.sin(bird.hitTimer*10)*0.5;
  }

  // Shadow/glow
  if(bird.alive){
    ctx.shadowColor='rgba(255,200,50,0.5)';
    ctx.shadowBlur=br*1.2;
  }

  // Body
  const bodyG=ctx.createRadialGradient(-br*0.2,-br*0.2,br*0.1,0,0,br);
  bodyG.addColorStop(0,'#fff8a0');
  bodyG.addColorStop(0.35,'#ffd020');
  bodyG.addColorStop(0.75,'#ff8800');
  bodyG.addColorStop(1,'#cc4400');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,0,br,br*0.88,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Wing (animated)
  const wingOff=Math.sin(bird.wingPhase)*(bird.alive?br*0.6:br*0.2);
  ctx.fillStyle='rgba(255,180,20,0.85)';
  ctx.beginPath();
  ctx.ellipse(-br*0.12,-br*0.1+wingOff*0.5,br*0.55,br*0.28,0.4+wingOff*0.02,0,Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(br*0.42,-br*0.22,br*0.32,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(br*0.5,-br*0.2,br*0.18,0,Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(br*0.54,-br*0.26,br*0.07,0,Math.PI*2); ctx.fill();

  // Beak
  ctx.fillStyle='#ff8000';
  ctx.beginPath();
  ctx.moveTo(br*0.72,-br*0.05);
  ctx.lineTo(br*1.12, br*0.05);
  ctx.lineTo(br*0.72, br*0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.moveTo(br*0.72, br*0.07);
  ctx.lineTo(br*1.1,  br*0.05);
  ctx.lineTo(br*0.72, br*0.12);
  ctx.closePath(); ctx.fill();

  // Blush
  ctx.fillStyle='rgba(255,80,80,0.35)';
  ctx.beginPath(); ctx.ellipse(br*0.3,br*0.28,br*0.22,br*0.12,0,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=1;
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    const a=p.life/p.ml;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*Math.max(0.1,a),0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ══════════════════════════════════════════
// UI SCREENS
// ══════════════════════════════════════════
function updateScoreUI(){
  const sc=document.getElementById('score');
  const bs=document.getElementById('best');
  if(state==='playing'){
    sc.textContent=score;
    bs.textContent='';
  } else {
    sc.textContent='';
    bs.textContent='';
  }
}

function setScreen(html){
  const s=document.getElementById('screen');
  s.innerHTML=html||'';
  s.style.display=html?'flex':'none';
}

function showMenu(){
  document.getElementById('score').textContent='';
  document.getElementById('best').textContent=best>0?`RÉCORD: ${best}`:'';
  setScreen(`
    <div class="sc-card">
      <div class="sc-title">🐦 SOMOS<br>FLAPPY</div>
      <div class="sc-sub">Toca o pulsa espacio<br>para comenzar</div>
    </div>
    <div class="tap-hint">▶ TOCA PARA JUGAR</div>
  `);
}

function showGameOver(){
  const medal = score>=40?'🏆':score>=20?'🥇':score>=10?'🥈':score>=5?'🥉':'💀';
  document.getElementById('score').textContent='';
  setScreen(`
    <div class="sc-card">
      <div class="medal">${medal}</div>
      <div class="sc-title">GAME OVER</div>
      <div class="sc-score">${score}</div>
      <div class="sc-best">RÉCORD: ${best}</div>
    </div>
    <div class="tap-hint">▶ TOCA PARA REINICIAR</div>
  `);
}

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
function handleInput(e){
  if(e.type==='touchstart') e.preventDefault();
  flap();
}
app.addEventListener('touchstart',handleInput,{passive:false});
app.addEventListener('mousedown',handleInput);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault(); flap();
  }
});
// Make sure taps on overlay screen also work
document.getElementById('screen').addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
document.getElementById('screen').addEventListener('mousedown',e=>{e.stopPropagation();flap();});

// ══════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);
  lastT=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('load',()=>{
  setTimeout(()=>{
    resize();
    buildBg();
    initBird();
    showMenu();
    requestAnimationFrame(ts=>{lastT=ts;loop(ts);});
  },80);
});
</script>
